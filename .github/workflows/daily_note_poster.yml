name: 毎日note記事を自動投稿

on:
  schedule:
    # 毎日午前8時（UTC）に実行 = JST 17時
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード（publish=公開 / draft=下書き保存のみ）'
        required: false
        default: publish
        type: choice
        options:
          - publish
          - draft

jobs:
  post-article:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Playwrightブラウザをインストール
        run: |
          playwright install --with-deps chromium

      - name: ログインセッションを復元
        env:
          NOTE_SESSION_STATE: ${{ secrets.NOTE_SESSION_STATE }}
        run: |
          printf '%s' "$NOTE_SESSION_STATE" > note_session.json

      - name: 記事を生成して投稿
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTE_PUBLISH_MODE: ${{ inputs.mode || 'publish' }}
        run: |
          python note_auto_poster.py

      - name: ログをアーティファクトとして保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-poster-logs
          path: note_poster.log
          retention-days: 30

      - name: 投稿履歴を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posted-articles
          path: posted_articles.jsonl
          retention-days: 365
          if-no-files-found: ignore

      - name: 失敗時のデバッグ情報を保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-error-debug
          path: |
            note_error_screenshot.png
            note_error_page.html
          retention-days: 30
          if-no-files-found: ignore
