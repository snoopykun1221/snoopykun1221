<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テレアポ カウンター</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1a2233;
    --sub: #6b7280;
    --border: #e5e9f0;
  }

  body {
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
  }

  header {
    text-align: center;
    margin-bottom: 16px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 700;
  }

  header .date {
    font-size: 13px;
    color: var(--sub);
    margin-top: 4px;
  }

  .timer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .timer .info .label {
    font-size: 12px;
    color: var(--sub);
  }

  .timer .info .time {
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }

  .timer .info .time.running {
    color: #16a34a;
  }

  .timer .controls {
    display: flex;
    gap: 8px;
  }

  .timer .controls button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .timer .controls button:active {
    filter: brightness(0.9);
  }

  #timerToggle {
    background: #16a34a;
    color: #fff;
    min-width: 84px;
  }

  #timerToggle.running {
    background: #ef4444;
  }

  #timerReset {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--sub);
  }

  .summary {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .summary .box {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
  }

  .summary .box .label {
    font-size: 12px;
    color: var(--sub);
  }

  .summary .box .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }

  button.count-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 18px 20px;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    cursor: pointer;
    transition: transform 0.05s ease, filter 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  button.count-btn:active {
    transform: scale(0.97);
    filter: brightness(0.9);
  }

  button.count-btn .num {
    background: rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    min-width: 52px;
    padding: 4px 12px;
    text-align: center;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .btn-rusu      { background: #64748b; } /* 電話不在 */
  .btn-fuzai     { background: #0ea5e9; } /* 社長不在 */
  .btn-block     { background: #f59e0b; } /* 受付ブロック */
  .btn-kotowari  { background: #ef4444; } /* 社長断り */
  .btn-apo       { background: #16a34a; } /* アポ獲得 */

  .actions {
    display: flex;
    gap: 8px;
  }

  .actions button {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--sub);
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }

  .actions button:active {
    filter: brightness(0.95);
  }

  .actions button.danger {
    color: #ef4444;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(80px);
    background: #1a2233;
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    transition: transform 0.2s ease, opacity 0.2s ease;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📞 テレアポ カウンター</h1>
    <div class="date" id="today"></div>
  </header>

  <div class="timer">
    <div class="info">
      <div class="label">稼働時間</div>
      <div class="time" id="timerDisplay">00:00:00</div>
    </div>
    <div class="controls">
      <button id="timerToggle">スタート</button>
      <button id="timerReset">リセット</button>
    </div>
  </div>

  <div class="summary">
    <div class="box">
      <div class="label">合計コール</div>
      <div class="value" id="total">0</div>
    </div>
    <div class="box">
      <div class="label">アポ獲得</div>
      <div class="value" id="apoCount" style="color:#16a34a;">0</div>
    </div>
    <div class="box">
      <div class="label">アポ率</div>
      <div class="value" id="rate">0%</div>
    </div>
  </div>

  <div class="buttons">
    <button class="count-btn btn-rusu" data-key="rusu">
      <span>電話不在</span><span class="num" id="num-rusu">0</span>
    </button>
    <button class="count-btn btn-fuzai" data-key="fuzai">
      <span>社長不在</span><span class="num" id="num-fuzai">0</span>
    </button>
    <button class="count-btn btn-block" data-key="block">
      <span>受付ブロック</span><span class="num" id="num-block">0</span>
    </button>
    <button class="count-btn btn-kotowari" data-key="kotowari">
      <span>社長断り</span><span class="num" id="num-kotowari">0</span>
    </button>
    <button class="count-btn btn-apo" data-key="apo">
      <span>アポ獲得</span><span class="num" id="num-apo">0</span>
    </button>
  </div>

  <div class="actions">
    <button id="undoBtn">↩ 1つ戻す</button>
    <button id="resetBtn" class="danger">リセット</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const KEYS = ["rusu", "fuzai", "block", "kotowari", "apo"];
  const LABELS = {
    rusu: "電話不在",
    fuzai: "社長不在",
    block: "受付ブロック",
    kotowari: "社長断り",
    apo: "アポ獲得",
  };
  const STORAGE_KEY = "teleapo-counts";
  const HISTORY_KEY = "teleapo-history";

  let counts = loadCounts();
  let history = loadHistory();

  function loadCounts() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      const c = {};
      KEYS.forEach(k => { c[k] = Number(saved[k]) || 0; });
      return c;
    } catch {
      const c = {};
      KEYS.forEach(k => { c[k] = 0; });
      return c;
    }
  }

  function loadHistory() {
    try {
      const h = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(h) ? h : [];
    } catch {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  }

  function render() {
    let total = 0;
    KEYS.forEach(k => {
      document.getElementById("num-" + k).textContent = counts[k];
      total += counts[k];
    });
    document.getElementById("total").textContent = total;
    document.getElementById("apoCount").textContent = counts.apo;
    const rate = total > 0 ? Math.round((counts.apo / total) * 1000) / 10 : 0;
    document.getElementById("rate").textContent = rate + "%";
  }

  let toastTimer;
  function showToast(msg) {
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1200);
  }

  document.querySelectorAll(".count-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.key;
      counts[key]++;
      history.push(key);
      save();
      render();
      showToast(LABELS[key] + " +1");
    });
  });

  document.getElementById("undoBtn").addEventListener("click", () => {
    const last = history.pop();
    if (!last) {
      showToast("戻す操作がありません");
      return;
    }
    if (counts[last] > 0) counts[last]--;
    save();
    render();
    showToast(LABELS[last] + " を取り消しました");
  });

  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("すべてのカウントをリセットしますか？")) return;
    KEYS.forEach(k => { counts[k] = 0; });
    history = [];
    save();
    render();
    showToast("リセットしました");
  });

  // ---- 稼働時間タイマー ----
  const TIMER_KEY = "teleapo-timer";
  // accumulated: 停止までに積み上がった時間(ms), startedAt: 稼働中なら開始時刻(ms), 停止中はnull
  let timer = loadTimer();
  let timerInterval = null;

  function loadTimer() {
    try {
      const t = JSON.parse(localStorage.getItem(TIMER_KEY)) || {};
      return {
        accumulated: Number(t.accumulated) || 0,
        startedAt: typeof t.startedAt === "number" ? t.startedAt : null,
      };
    } catch {
      return { accumulated: 0, startedAt: null };
    }
  }

  function saveTimer() {
    localStorage.setItem(TIMER_KEY, JSON.stringify(timer));
  }

  function elapsedMs() {
    return timer.accumulated + (timer.startedAt ? Date.now() - timer.startedAt : 0);
  }

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const h = String(Math.floor(s / 3600)).padStart(2, "0");
    const m = String(Math.floor((s % 3600) / 60)).padStart(2, "0");
    const sec = String(s % 60).padStart(2, "0");
    return h + ":" + m + ":" + sec;
  }

  function renderTimer() {
    const display = document.getElementById("timerDisplay");
    const toggle = document.getElementById("timerToggle");
    display.textContent = formatTime(elapsedMs());
    const running = timer.startedAt !== null;
    display.classList.toggle("running", running);
    toggle.classList.toggle("running", running);
    toggle.textContent = running ? "ストップ" : "スタート";
  }

  function startTicking() {
    clearInterval(timerInterval);
    timerInterval = setInterval(renderTimer, 1000);
  }

  document.getElementById("timerToggle").addEventListener("click", () => {
    if (timer.startedAt === null) {
      timer.startedAt = Date.now();
      startTicking();
      showToast("稼働開始");
    } else {
      timer.accumulated += Date.now() - timer.startedAt;
      timer.startedAt = null;
      clearInterval(timerInterval);
      showToast("稼働停止");
    }
    saveTimer();
    renderTimer();
  });

  document.getElementById("timerReset").addEventListener("click", () => {
    if (!confirm("稼働時間をリセットしますか？")) return;
    timer = { accumulated: 0, startedAt: null };
    clearInterval(timerInterval);
    saveTimer();
    renderTimer();
    showToast("稼働時間をリセットしました");
  });

  const now = new Date();
  document.getElementById("today").textContent =
    now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日";

  render();
  renderTimer();
  if (timer.startedAt !== null) startTicking();
</script>
</body>
</html>
